simple_pure_pursuit_controller:
  ros__parameters:
    use_sim_time: false
    path_topic: /rubi/planner_comparison/grid/tracking_path
    cmd_vel_topic: /legged/cmd_raw
    map_frame: map
    base_frame: base_link
    control_frequency_hz: 10.0
    transform_timeout_s: 0.03
    path_timeout_s: 0.0
    lookahead_distance_m: 0.65
    nearest_search_backtrack_points: 2
    nominal_linear_velocity_mps: 0.7
    min_tracking_velocity_mps: 0.05
    curvature_velocity_gain: 0.5
    max_linear_velocity_mps: 0.7
    max_angular_velocity_rps: 1.0
    max_linear_acceleration_mps2: 0.5
    max_angular_acceleration_rps2: 1.0
    goal_tolerance_m: 0.2
    max_cross_track_error_m: 0.4
    # Track moderate bends while moving; reserve stop-and-turn for large errors.
    align_enter_rad: 1.2
    align_exit_rad: 0.5
    align_gain: 1.0
    align_max_yaw_rate: 0.5
    max_tf_age_s: 0.5
