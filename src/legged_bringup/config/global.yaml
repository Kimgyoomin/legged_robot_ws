/rubi_global_heightmap_wrapper:
  ros__parameters:
    input_topic: /rubi/local_elevation/grid_map
    input_convention: grid_map
    output_topic: /rubi/global_elevation/cloud
    map_frame: map
    resolution: 0.05
    origin_x: -25.0
    origin_y: -25.0
    length_x: 50.0
    length_y: 50.0
    max_variance: 0.04
    invalid_cell_policy: retain
    publish_fps: 1.0
    output_directory: /tmp/rubi_mapping_results
    load_path: ''
