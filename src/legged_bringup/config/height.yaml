# GPU 추정 세부 설정. mapping.launch.py의 입력/frame/거리/ray 설정은
# mapping.yaml에서 가져와 아래 동일 항목보다 우선 적용합니다.
/rubi_height_mapping:
  ros__parameters:
    cleanup_cos_thresh: 0.2
    cleanup_step: 0.05
    dilation_size: 3
    drift_compensation_alpha: 0.1
    drift_compensation_variance_inlier: 0.1
    enable_drift_compensation: false
    enable_edge_sharpen: false
    enable_overlap_clearance: false
    enable_visibility_cleanup: true
    # all: baseline; voxel: one original ray per 3D voxel, height observations unchanged.
    ray_mode: all
    ray_voxel_size: 0.0  # 0 = resolution; explicit range [resolution/4, resolution]
    initial_variance: 1000.0
    mahalanobis_thresh: 2.0
    map_length: 8.0
    max_drift: 0.1
    max_height_range: 2.5
    max_ray_length: 3.0
    max_variance: 100.0
    min_height_drift_cnt: 100
    min_valid_distance: 0.1
    orientation_noise_thresh: 0.01
    outlier_variance: 0.01
    overlap_clear_range_xy: 4.0
    overlap_clear_range_z: 2.0
    position_noise_thresh: 0.01
    ramped_height_range_a: 0.3
    ramped_height_range_b: 1.0
    ramped_height_range_c: 0.2
    resolution: 0.05
    sensor_noise_factor: 0.05
    time_interval: 0.1
    time_variance: 0.0001
    traversability_inlier: 0.9
    wall_num_thresh: 100
    map_frame: map
    base_frame: base_link
    # Empty: dynamic TF mode. Otherwise subscribe to nav_msgs/Odometry directly.
    odom_topic: ''
    odom_cache_seconds: 10.0
    odom_max_gap: 0.2
    input_topic: /livox/lidar_PointCloud2
    output_topic: /rubi/local_elevation/grid_map
    min_range: 0.6
    max_range: 3.0
    tf_wait_timeout: 1.5
    tf_queue_size: 20
    tf_queue_max_bytes: 67108864
    tf_retry_period: 0.02
    tf_max_scans_per_tick: 1
    publish_fps: 5.0
    update_variance_fps: 5.0
    statistics_fps: 0.2
