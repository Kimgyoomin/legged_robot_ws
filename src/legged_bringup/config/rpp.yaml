# Nav2 Humble Regulated Pure Pursuit. Selected by mode:=nav2 controller:=rpp.
# Simulation starting profile; follows the height planner's raw path.
plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
desired_linear_vel: 0.5
lookahead_dist: 0.6
min_lookahead_dist: 0.4
max_lookahead_dist: 0.8
lookahead_time: 1.2
use_velocity_scaled_lookahead_dist: true
use_interpolation: true
transform_tolerance: 0.6
min_approach_linear_velocity: 0.05
approach_velocity_scaling_dist: 0.6
use_collision_detection: true
max_allowed_time_to_collision_up_to_carrot: 1.0
use_regulated_linear_velocity_scaling: true
regulated_linear_scaling_min_radius: 0.9
regulated_linear_scaling_min_speed: 0.05
use_cost_regulated_linear_velocity_scaling: true
cost_scaling_dist: 0.4
cost_scaling_gain: 1.0
# Must match local_costmap.inflation_layer.cost_scaling_factor.
inflation_cost_scaling_factor: 5.0
use_rotate_to_heading: true
rotate_to_heading_angular_vel: 0.4
rotate_to_heading_min_angle: 0.7
max_angular_accel: 1.0
allow_reversing: false
max_robot_pose_search_dist: 3.0
