# obstacle_cloud selects body-relative height first. Nav2 tests Z after
# transforming to map: use a broad +/-10 km pass band at BOTH layer/source
# levels so an arbitrary map altitude does not remove valid robot obstacles.
# navigate.launch.py replaces the radius below with collision.yaml Stop.points
# and zero extra padding. The radius is only a standalone costmap fallback.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.6
      track_unknown_space: false
      robot_radius: 0.3
      footprint_padding: 0.01
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        min_obstacle_height: -10000.0
        max_obstacle_height: 10000.0
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: livox_cloud
        livox_cloud:
          topic: /legged/obstacles
          data_type: PointCloud2
          marking: true
          clearing: true
          # Directional 0.3/0.6 m rejection is already applied by obstacle_cloud.
          obstacle_min_range: 0.3
          obstacle_max_range: 4.0
          raytrace_min_range: 0.0
          raytrace_max_range: 4.0
          min_obstacle_height: -10000.0
          max_obstacle_height: 10000.0
          observation_persistence: 0.0
          expected_update_rate: 0.4
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.7
        cost_scaling_factor: 5.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.6
      resolution: 0.05
      track_unknown_space: true
      rolling_window: false
      robot_radius: 0.3
      footprint_padding: 0.01
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        min_obstacle_height: -10000.0
        max_obstacle_height: 10000.0
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: livox_cloud
        livox_cloud:
          topic: /legged/obstacles
          data_type: PointCloud2
          marking: true
          clearing: true
          # Keep consistent with obstacle.yaml front_min_range.
          obstacle_min_range: 0.3
          obstacle_max_range: 4.0
          raytrace_min_range: 0.0
          raytrace_max_range: 5.0
          min_obstacle_height: -10000.0
          max_obstacle_height: 10000.0
          observation_persistence: 0.0
          expected_update_rate: 0.4
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.7
        cost_scaling_factor: 1.0
      always_send_full_costmap: true
