<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
<title id="title">Height Map 기반 전역 경로 계획 시스템 구성도</title>
<desc id="desc">LiDAR와 IMU 기록 데이터, LIO/SLAM 지원 모듈, 지역 Height Map 생성, C++ 전역 누적, 저장과 선택적 후처리, Frozen Height Map과 costmap 기반 Grid A* 전역 경로 생성까지의 개요. SVG의 텍스트와 도형은 모두 편집 가능.</desc>
