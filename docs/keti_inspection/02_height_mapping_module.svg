<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="875" viewBox="0 0 1600 875" role="img" aria-labelledby="title desc">
<title id="title">Height Mapping 모듈 상세 구조도</title>
<desc id="desc">보정된 PointCloud2와 map 좌표 Odometry를 입력받아, rubi_height_mapping에서 시각 정합과 거리/좌표 변환, CuPy CUDA Elevation 및 Variance 추정을 거쳐 Local GridMap으로 변환하고, rubi_global_heightmap_wrapper에서 전역 누적 및 PCD/RGHM 저장하는 ROS2 모듈 구조. 모든 요소는 편집 가능한 SVG 벡터와 텍스트.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#1E3B5A"/></marker></defs>
<g font-family="Noto Sans KR, Noto Sans CJK KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
<rect x="0" y="0" width="1600" height="875" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0" />
<text x="42" y="71" font-size="46" font-weight="700" fill="#102A4A" text-anchor="start">Height Mapping 모듈 상세 구조도</text>
<text x="43" y="116" font-size="23" font-weight="400" fill="#52677D" text-anchor="start">보정 점군 + Pose → 입력·시각 처리 → CUDA 지역 Elevation 추정 → C++ 전역 누적 → 지도 저장</text>
