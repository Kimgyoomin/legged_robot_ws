<text x="426" y="336" class="desc">기존 표면과 광선 모순 검사</text>
<text x="426" y="358" class="desc">삭제 증거 / upper bound 최솟값</text>
<rect x="790" y="190" width="300" height="105" rx="10" fill="#dff4ec" stroke="#aec5d6"/>
