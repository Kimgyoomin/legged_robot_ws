<style>text{font-family:"Noto Sans CJK KR","Noto Sans",sans-serif} .title{font-size:24px;font-weight:700;fill:#102b43}.small{font-size:15px;fill:#536f83}.name{font-size:19px;font-weight:700;fill:#102b43}.desc{font-size:15px;fill:#355368}</style>
<rect width="1120" height="615" rx="16" fill="#f3f7fa"/>
<text x="30" y="40" class="title">GPU 높이 갱신: 읽기와 쓰기 분리</text>
<text x="30" y="67" class="small">같은 scan의 모든 점은 같은 이전 지도를 읽습니다. 후보 집계가 끝난 뒤 셀별로 확정합니다.</text>
<path d="M330 152 H405" fill="none" stroke="#68859c" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M180 205 V332 H405" fill="none" stroke="#68859c" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M710 152 H750 V223 H785" fill="none" stroke="#68859c" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M710 332 H750 V260 H785" fill="none" stroke="#68859c" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M940 295 V522 H715" fill="none" stroke="#68859c" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="30" y="100" width="300" height="105" rx="10" fill="#eaf4ff" stroke="#aec5d6"/>
<text x="46" y="130" class="name">이전 지도 Mₖ</text>
<text x="46" y="156" class="desc">재사용 snapshot · float32</text>
<text x="46" y="178" class="desc">높이 / 분산 / 유효성 / age</text>
<rect x="410" y="100" width="300" height="105" rx="10" fill="#dff4ec" stroke="#aec5d6"/>
<text x="426" y="130" class="name">점군 → 높이 후보</text>
<text x="426" y="156" class="desc">동일 기준으로 이상치 판정</text>
<text x="426" y="178" class="desc">높이·분산 합 / 채택 수</text>
